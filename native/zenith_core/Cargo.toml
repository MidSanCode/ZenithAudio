[package]
name = "zenith_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ZENITH AUDIO native DSP / sequencer / plugin core (C ABI over dart:ffi)"

[lib]
name = "zenith_core"
# staticlib: linked into the Flutter desktop runner at build time.
# cdylib:    loaded dynamically by plugin hosts and the WASM/dev path.
# rlib:      lets the crate's own unit/integration tests link it normally.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]

[features]
# The real device driver. It is an optional feature so the default build has no
# external crate dependency and compiles (and tests) on a machine with no audio
# hardware and no network. Enabling it requires the `cpal` dependency below.
#
# To turn it on, uncomment the dependency and build with `--features cpal`:
#
#   [dependencies]
#   cpal = { version = "0.15", optional = true }
#
# `driver::cpal_driver` is compiled only under this feature.
cpal = []

[dev-dependencies]
